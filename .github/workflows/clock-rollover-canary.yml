name: Clock rollover canary

# Re-runs the unit suite with "today" wound forward, so a test that still reads
# the real calendar is caught here — on main or overnight — instead of turning
# `main` and every open pull request red one arbitrary morning (#2481, and the
# four times it already happened: #2426, #2401, #2443, #2479).
#
# Every test file is frozen at 2026-07-01T00:00:00.000Z by vitest.setup.ts. That
# freeze is not airtight by construction: a file can opt out
# (src/lib/__tests__/frozen-test-clock.test.ts pins the allowlist), and code can
# reach a date through a path the freeze does not cover. This job is the second
# layer that finds those.
#
# DELIBERATELY NOT A PULL-REQUEST CHECK (owner decision, 2 Aug 2026). It has no
# `pull_request` trigger, so it can never appear as a required check and can
# never block unrelated work on a problem that is, by construction, not urgent
# yet. Do not add one — add a `workflow_dispatch` run instead if you want it on
# a branch. Branch protection is untouched by this file.

on:
  push:
    branches:
      - main
  schedule:
    # 14:00 UTC = 02:00 NZST — after the day's merges, before anyone starts.
    - cron: "0 14 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never cancel: each wound-forward verdict stands on its own, and a cancelled
  # canary reads as "no problem found" when nothing was actually checked.
  group: clock-rollover-canary-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  wound-forward-suite:
    name: Unit suite with the clock wound ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Each offset can expose a different fixture; report all three, never stop
      # at the first.
      fail-fast: false
      matrix:
        include:
          - label: forward 1 day
            offset_days: 1
          - label: forward 1 month
            offset_days: 30
          - label: forward 1 year
            offset_days: 365
    env:
      # Mirrors the `verify` job's environment: the unit suite needs these to
      # exist, not to be reachable. DATABASE_URL is an unreachable dummy that
      # only lets prisma.config.ts resolve.
      AUTH_SECRET: ci-auth-secret
      NEXTAUTH_SECRET: ci-auth-secret
      NEXTAUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "false"
      CRON_SECRET: ci-cron-secret
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tacbookings
      STRIPE_SECRET_KEY: sk_test_fake
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_fake
      XERO_ENABLE_DAILY_MEMBERSHIP_REFRESH: "false"
      XERO_ENABLE_LIVE_MEMBER_GROUP_LOOKUPS: "false"
      XERO_ENABLE_AUTOLOAD_XERO_CONTACT_GROUPS: "false"
      # The one line that makes this job different from `verify`. Read by
      # src/lib/__tests__/helpers/clock.ts; a malformed value fails the run
      # rather than silently falling back to the frozen instant.
      TEST_CLOCK_OFFSET_DAYS: ${{ matrix.offset_days }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run the unit suite with the clock wound ${{ matrix.label }}
        run: npm test

      - name: Explain a red canary
        if: failure()
        run: |
          {
            echo "## Clock rollover canary failed (${{ matrix.label }})"
            echo
            echo "The unit suite was re-run with \`TEST_CLOCK_OFFSET_DAYS=${{ matrix.offset_days }}\`,"
            echo "moving the frozen \"today\" from 2026-07-01 ${{ matrix.label }}."
            echo
            echo "**This is almost certainly not caused by the commit that triggered it.**"
            echo "It means a test still depends on what the calendar says, so it will go red"
            echo "on its own one day and take \`main\` and every open PR with it."
            echo
            echo "To reproduce locally:"
            echo
            echo '```bash'
            echo "TEST_CLOCK_OFFSET_DAYS=${{ matrix.offset_days }} npm test"
            echo '```'
            echo
            echo "Fix the fixture (move the dates, or pin that suite's own instant) rather"
            echo "than opting the file out — see docs/TESTING.md, \"The frozen test clock\"."
          } >> "$GITHUB_STEP_SUMMARY"
